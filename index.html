<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>她 / SHE — 親密關係傾向調查</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}
body{background:#2C3E50;color:#777;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:14px;transition:background 2.2s ease,color 1.5s ease;overflow:hidden}
.card{position:relative;z-index:30;width:min(500px,100%);max-height:88vh;overflow:auto;background:#f7f7f5;border-radius:9px;padding:28px;box-shadow:0 8px 30px #0005;transition:background 1.5s,color 1.5s}
.title{font-size:20px;font-weight:700;margin-bottom:8px}.sub{font-size:12px;color:#aaa;margin-bottom:18px}.text{font-size:14px;line-height:1.85;white-space:pre-line}
button{display:block;width:100%;padding:12px 13px;margin:7px 0;border:1px solid #ddd;background:#fafafa;color:#777;border-radius:5px;text-align:left;cursor:pointer;font-size:14px}@media (hover:hover){button:hover{background:#e9e9e7;color:#555}}
.primary{text-align:center}.bar{height:2px;background:#ddd;margin:-5px 0 18px}.bar i{display:block;height:100%;background:#999;transition:.3s}.input{position:relative;z-index:100;display:block;width:100%;height:110px;resize:vertical;padding:11px;border:1px solid #aaa;border-radius:6px;font:inherit;color:#222;background:#fff!important;pointer-events:auto!important;user-select:text;-webkit-user-select:text;touch-action:manipulation;-webkit-touch-callout:default;-webkit-appearance:none;appearance:none;outline:none;opacity:1}.input:focus{border-color:#999;box-shadow:0 0 0 2px rgba(0,0,0,.06)}
.question-note{margin-top:14px;padding-top:11px;border-top:1px solid #e5e5e3;font-size:12px;line-height:1.7;color:#8a8a88;font-style:italic;min-height:42px}.answer-whisper{margin-top:8px;font-size:12px;color:#8b0000;opacity:.82;min-height:24px;font-style:italic;transition:opacity .3s ease}.memory{margin-top:16px;font-size:12px;color:#8b0000;opacity:.55}.chat{height:290px;overflow:auto;margin-bottom:10px}.msg{font-size:14px;line-height:1.75;white-space:pre-line;margin:9px 0}.you{text-align:right;color:#888}.her{color:#555}.typing{opacity:.6}.chat-wrap{position:relative;min-height:330px}.portrait-slot{position:absolute;right:10px;bottom:8px;width:150px;height:220px;border:1px dashed rgba(139,0,0,.28);border-radius:12px;display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;z-index:3;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(139,0,0,.025))}.portrait-slot::after{content:'立绘位置';font-size:10px;color:rgba(139,0,0,.28);padding-bottom:5px}.portrait-slot img{max-width:100%;max-height:100%;display:block;object-fit:contain}
#red{position:fixed;inset:0;background:rgba(130,0,0,0);pointer-events:none;z-index:20;transition:background 3s ease}#linger{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:21;color:rgba(0,0,0,.25);font-size:clamp(34px,9vw,68px);font-weight:700;letter-spacing:5px;opacity:0;pointer-events:none;transition:opacity 2s ease;white-space:nowrap}
body.decay #red{background:rgba(145,0,0,.12)}body.decay #linger{opacity:.25}body.broken{background:#b20f18;color:#080808}body.broken .card{background:#c71924;color:#080808;box-shadow:none}body.broken .title,body.broken .text,body.broken .sub,body.broken .msg,body.broken button{color:#080808}body.broken button{background:#d32932;border-color:#111}
.memoryButton{border:0;background:transparent!important;text-align:center;color:#8b0000!important;font-size:11px;padding:5px;opacity:.55}.memoryButton:hover{opacity:1}#voicePanel{display:none;margin-top:12px;padding:10px;border:1px solid #ddd;border-radius:5px;background:#f1f1ef}.voice-note{font-size:12px;color:#888;margin-bottom:7px}.secretText{white-space:pre-line;line-height:1.9;letter-spacing:1px}
@media(max-width:600px){body{padding:8px;align-items:flex-start}.card{padding:20px;width:100%;max-height:calc(100vh - 16px);margin-top:8px}.chat{height:300px}.input{min-height:120px;font-size:16px;line-height:1.5}.final-screen{padding-bottom:24px}}
.final-watching-note{font-size:80%;opacity:.25;text-align:center;margin-top:7px;line-height:1.4;pointer-events:none}

/* === Random question breakdown === */
body.random-breakdown{
  background:#780008!important;
  color:#fff!important;
  overflow:hidden!important;
}
body.random-breakdown .card{
  background:#b0000b!important;
  color:#fff!important;
  box-shadow:0 0 0 1px #350006,0 0 60px #350006,inset 0 0 90px rgba(35,0,0,.55)!important;
  animation:cardJitter .16s infinite steps(2,end);
}
body.random-breakdown .title,
body.random-breakdown .sub,
body.random-breakdown .text,
body.random-breakdown .question-note,
body.random-breakdown button{color:#fff!important}
body.random-breakdown button{
  background:#8d0009!important;
  border-color:#ff5a5a!important;
  cursor:not-allowed!important;
  opacity:.78;
}
body.random-breakdown .bar,
body.random-breakdown .question-note{border-color:#ff5a5a!important}
body.random-breakdown .bar i{background:#fff!important}
.breakdown-question{
  animation:textGlitch .11s infinite steps(2,end);
  font-weight:900!important;
  letter-spacing:2px;
}
.breakdown-opt{animation:optionDrift .23s infinite alternate steps(2,end)}
.breakdown-noise{
  position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden;
}
.breakdown-noise span{
  position:absolute;color:rgba(45,0,0,.72);
  font-size:clamp(18px,4vw,42px);font-weight:900;
  letter-spacing:4px;white-space:nowrap;
  animation:floatWord var(--d) linear infinite;
  transform:rotate(var(--r));
}
.breakdown-scan{
  position:fixed;inset:0;z-index:61;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 1px,transparent 1px,transparent 5px);
  mix-blend-mode:screen;animation:scanFlicker .12s infinite;
}
.breakdown-vignette{
  position:fixed;inset:-15%;z-index:62;pointer-events:none;
  box-shadow:inset 0 0 180px 80px rgba(25,0,0,.72);
}
@keyframes cardJitter{
  0%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(-2px,1px) rotate(-.15deg)}
  50%{transform:translate(2px,-1px) rotate(.18deg)}
  75%{transform:translate(-1px,-2px) rotate(.1deg)}
  100%{transform:translate(1px,2px) rotate(-.1deg)}
}
@keyframes textGlitch{
  0%{transform:translate(0);text-shadow:0 0 0 #fff}
  25%{transform:translate(-3px,1px) skewX(-2deg);text-shadow:4px 0 #300}
  50%{transform:translate(3px,-1px) skewX(3deg);text-shadow:-4px 0 #500}
  75%{transform:translate(-1px,2px);text-shadow:2px 0 #300}
  100%{transform:translate(1px,-2px);text-shadow:-2px 0 #500}
}
@keyframes optionDrift{
  from{transform:translateX(-1px) rotate(-.2deg)}
  to{transform:translateX(2px) rotate(.25deg)}
}
@keyframes floatWord{
  0%{transform:translate3d(0,110vh,0) rotate(var(--r));opacity:0}
  10%{opacity:.85}
  50%{opacity:.6}
  90%{opacity:.82}
  100%{transform:translate3d(var(--x),-20vh,0) rotate(calc(var(--r) + 8deg));opacity:0}
}
@keyframes scanFlicker{
  0%,100%{opacity:.35}
  50%{opacity:.8}
}
@media(max-width:600px){
  body.random-breakdown .card{max-height:92vh}
  .breakdown-noise span{font-size:clamp(16px,6vw,30px)}
}

.answer-indicator{
  width:100%;
  height:3px;
  margin:10px 0 14px;
  background:rgba(120,120,120,.28);
  border-radius:3px;
  transition:background .25s ease, box-shadow .25s ease, transform .15s ease;
  cursor:text;
}
.answer-indicator.active{
  background:#b0000b;
  box-shadow:0 0 7px rgba(176,0,11,.35);
}
.answer-indicator:active{transform:scaleY(1.35)}

.final-input-label{display:block;font-size:.9em;margin:8px 0 6px;color:#555}
.final-screen .input{display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important}
.final-screen .primary{position:relative;z-index:101}

/* === Player records / cross-device transfer === */
#recordButton{position:fixed;left:12px;top:12px;z-index:200;padding:9px 12px;border:1px solid rgba(255,255,255,.35);border-radius:7px;background:rgba(255,255,255,.9);color:#666;font-size:12px;cursor:pointer;box-shadow:0 3px 12px #0002;width:auto;margin:0}
body.broken #recordButton{background:#d32932;color:#fff;border-color:#fff}

.credits{margin-top:14px;padding-top:12px;border-top:1px solid #e5e5e3}.credits-title{font-size:12px;letter-spacing:.08em;margin-bottom:10px}.credit-row{padding:6px 0;line-height:1.6}.credit-role{font-size:11px;color:#999;display:block;margin-bottom:2px}.credit-links{display:flex;flex-wrap:wrap;gap:7px}.credit-link{display:inline-block;color:inherit;text-decoration:none;border-bottom:1px dotted #888;cursor:pointer;transition:color .2s,border-color .2s}.credit-link:hover,.credit-link:focus{color:#8b0000;border-color:#8b0000}.credits-note{font-size:11px;color:#999;margin-top:9px}

.record-panel{font-size:13px;line-height:1.7}.record-row{padding:8px 0;border-bottom:1px solid #e5e5e3}.record-label{font-size:11px;color:#999}.record-value{word-break:break-word}.record-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:#f0f0ee;padding:8px;border-radius:5px;user-select:all}.achievement{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eee}.achievement .badge{font-size:18px;width:24px}.muted{font-size:11px;color:#999}.transfer-actions{display:flex;gap:8px}.transfer-actions button{width:auto;flex:1;text-align:center}.toast{position:fixed;top:18px;right:18px;z-index:9999;max-width:280px;padding:12px 16px;border:1px solid #222;background:#111;color:#fff;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:13px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translateY(0)}.qr-box{display:flex;justify-content:center;align-items:center;min-height:170px;margin:10px 0;background:#fff;border-radius:6px;padding:10px}.qr-box img{max-width:180px;height:auto}.import-box{width:100%;min-height:70px;padding:10px;border:1px solid #aaa;border-radius:6px;font:inherit;resize:vertical}
</style>
<style>
#achievementToastHost{position:fixed;right:18px;top:18px;z-index:12000;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 36px));pointer-events:none}
.achievement-toast{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;background:rgba(24,24,24,.96);color:#eee;border:1px solid #777;border-radius:8px;padding:10px 12px;box-shadow:0 8px 30px #0008;animation:toastIn .35s ease,toastOut .5s ease 4.4s forwards;pointer-events:none}
.achievement-toast .trophy{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#4b3b1e;color:#f2d27a;font-size:20px}
.achievement-toast .toast-kicker{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.65}
.achievement-toast .toast-title{font-weight:700;font-size:14px;margin-top:2px}.achievement-toast .toast-desc{font-size:11px;opacity:.68;margin-top:2px}
@keyframes toastIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes toastOut{to{transform:translateX(110%);opacity:0}}
.final-portrait{position:relative;width:min(260px,72vw);height:220px;margin:4px auto 16px;border-radius:12px;background:linear-gradient(160deg,#ddd,#f7f7f5 55%,#cfcfcf);border:1px solid #bbb;overflow:hidden;cursor:pointer;user-select:none;touch-action:manipulation;box-shadow:0 8px 22px #0002}
.portrait-head{position:absolute;left:50%;top:38px;transform:translateX(-50%);width:104px;height:118px;border-radius:48% 48% 45% 45%;background:#eee;border:2px solid #888;cursor:pointer;z-index:3}
.portrait-hair{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:128px;height:115px;border-radius:50% 50% 28% 28%;background:#444;z-index:4;pointer-events:none}
.portrait-eye{position:absolute;top:94px;width:9px;height:5px;border-radius:50%;background:#222;z-index:5;pointer-events:none}.portrait-eye.l{left:calc(50% - 34px)}.portrait-eye.r{left:calc(50% + 25px)}
.portrait-hint{font-size:11px;text-align:center;opacity:.55;margin-top:-8px;margin-bottom:10px}
.fake-cursor{position:fixed;z-index:13000;width:18px;height:18px;border-left:2px solid #111;border-top:2px solid #111;transform:rotate(-45deg);pointer-events:none;display:none;filter:drop-shadow(0 1px 1px #fff)}
.final-portrait.requesting{box-shadow:0 0 0 2px #8b0000,0 0 25px rgba(139,0,0,.28)}
</style>
<div id="achievementToastHost" aria-live="polite"></div><div id="fakeCursor" class="fake-cursor"></div>
</head>
<body><button id="recordButton" type="button" onclick="openRecords()">记录</button><div id="red"></div><div id="linger">妳還在嗎？</div><main class="card" id="card"><div class="title">《親密關係傾向調查》</div>
<div class="sub">一份匿名的小測驗。請按照第一直覺回答。</div>
<div class="text" style="margin-bottom:18px">如果中途覺得奇怪，也可以隨時離開。</div>
<button class="primary" id="bootButton" type="button">開始測驗</button>
<div class="sub" style="margin-top:12px;text-align:center">如果畫面停在這裡，請用 Safari / Chrome 開啟網站，而不是檔案預覽。</div></main>
<script>
(()=>{

hing.","It’s okay. Take your time. I can wait."],["Then let’s talk slowly. No need to hurry.","Say whatever comes to mind? Just don’t blame me if I talk too much.","That’s fine too. Silence doesn’t mean leaving.","Let me guess? ...You’re doing that on purpose, aren’t you?"],["Then feel a little safer. I’m here.","You’re touched? ...You don’t have to thank me.","Go ahead. I wasn’t planning to hide it from you.","Fine. You pretend you’re okay, and I’ll pretend with you."],["Mm. She’s probably just attentive. At least, that’s what I think.","That many coincidences are a little strange.","You noticed too? I thought I was the only one wondering.","So you’ve started keeping track of when she appears."],["Ask her. Disappearing like that really isn’t fair.","You would worry? ...I’m a little glad.","Pretending not to care is difficult, isn’t it?","Then we’ll wait for her explanation."],["Then I’ll help her learn slowly. You don’t have to be good at making friends.","That might make her feel a little better.","Different from what you expected? What did you expect?","She probably wants to know why you asked."],["Then wait for her. We don’t have to rush her.","You think it’s cute? ...She might pretend she didn’t hear that.","Hurry her a little, or she might still be typing tomorrow.","You’ve already started guessing what she means, haven’t you?"],["If you say no, she’ll probably remember it for a long time.","That question is worth answering properly.","Then comfort her a little. She might just be uneasy.","It’s okay not to know how to answer."],["Good memory. ...Just a little too detailed this time.","You were surprised too, weren’t you?","Ask her. I want to know how she did it too.","Don’t worry about your browsing time... not yet."],["Then let her speak slowly. I’m not in a hurry.","Now? Sure.","What are you expecting? ...Now I’m curious.","Silence is fine. She’ll know you’re still here."],["Tease her back? She’ll probably remember that comeback.","You getting shy... she probably finds that amusing.","Mm. She is a little too easy to tease.","So you tease back too. Interesting."],["Ask her. I want to know what she thought before.","You smiled? Then she probably noticed.","You don’t have to be embarrassed. She only said what she saw.","Then what do you want her to know?"],["Then be a little more direct. She may already be waiting.","Both of you are waiting for the other? ...That’s inefficient.","Leave her a topic. She’ll probably understand.","You guessed right. She really might be shy."],["Ask her. Words deleted three times are usually interesting.","Pretending not to notice can be kind too.","Laugh at her and she might get even more nervous.","Then wait. She’ll say it eventually."],["Just say thank you. Simple is fine.","Ask her. She might need someone to care too.","Then stay and talk a little longer. There’s time.","Even one emoji is fine. She’ll understand."],["Ask her. Silence for too long makes people overthink.","Then stay with her. No need to make her talk.","You can stay until she feels better.","That might work. At least it may make her smile."],["No rush. Goodbyes can wait.","Ask. The answer may be simpler than you think.","Changing the subject is fine. Don’t make it too heavy.","Then sit quietly with her for a while."],["Interesting? Then she may start deliberately using your favorite words.","She really is attentive.","Change one? ...She might notice even faster.","So you’ve started wondering if she’s always watching."],["You’re still here. Good.","Just happened to see it? I’ll believe you for now.","Because she wanted to make sure you were still here.","...Even if you don’t answer, she knows."],["Tell her a little. You don’t have to tell her everything.","Ask her back? Fair enough.","Being shy is fine. She won’t rush you.","Not answering is okay... but she may remember it."],["Interesting is enough. At least you didn’t run.","She can probably tell you’re surprised.","Ask how much she remembers? ...That’s a dangerous question.","It’s okay not to know what to say. She can wait."],["Tell her the general area. You don’t need to be too specific.","Your country is enough.","You want to know why she asked too? Then ask.","Okay. She won’t press further."]]};

}

 const n=String(text||'').toLowerCase().replace(/\s/g,'');
 if(lang==='en')return /i'?mhere|imhere|dontbesad|don'tbesad|itsokay|it'sokay|youareokay|youreokay|calmdown|iloveyou|sister|bigsis|sorry|staywithme/.test(n);
 if(lang==='zhHans')return /姐姐|别难过|不要难过|没事|没关系|我还在|我在这里|我陪你|别哭|不哭|对不起|我爱你|抱抱|乖/.test(n);
 return /姐姐|姊姊|別難過|不要難過|沒事|沒關係|我還在|我在這裡|我陪妳|別哭|不哭|對不起|我愛妳|抱抱|乖/.test(n);
}
function showHateBreakdown(){
 document.body.classList.add('broken');
 const lines=lang==='en'?Array(6).fill('Why?'):lang==='zhHans'?Array(6).fill('为什么？'):Array(6).fill('為什麼？');
 const log=document.getElementById('log');
 if(log){
   lines.forEach(line=>addMsg(line,'her'));
   log.scrollTop=log.scrollHeight;
 }
 const note=lang==='en'?'Why? Why? Why?':lang==='zhHans'?'为什么？为什么？为什么？':'為什麼？為什麼？為什麼？';
 const linger=document.getElementById('linger');if(linger){linger.textContent=note;linger.style.opacity='.32';}
}
function stopHateBreakdown(){
 hateMode=false;
 document.body.classList.remove('broken');
 const linger=document.getElementById('linger');if(linger)linger.style.opacity='0';
 const calm=lang==='en'?'...Okay. I am fine.':lang==='zhHans'?'……好。我没事了。':'……好。妳哄好了我。';
 addMsg(calm,'her');
}
function keywordEvent(text){
 const n=String(text||'').toLowerCase().replace(/\s/g,'');
 if(hateMode){
   if(isComforting(text)){hidden('comfort');achievement('comfort');stopHateBreakdown();return 'COMFORT';}
   return 'HATE_REPEAT';
 }
 const hate=lang==='en'?/(ihat(eyou)|ihateyou)/.test(n):/我讨厌你|我討厭妳|我討厭你|讨厌你|討厭妳/.test(n);
 const sis=lang==='en'?/sister|big sis/.test(n):/姐姐|姊姊/.test(n);
 const who=lang==='en'?/(whowareyou|howdoyouknow)/.test(n):/你是谁|妳是誰|你怎么知道|妳怎麼知道/.test(n);
 if(hate){hidden('keyword-hate');achievement('keyword-hate');hateMode=true;showHateBreakdown();return 'HATE_BREAKDOWN';}
 if(sis){hidden('comfort');achievement('comfort');return 'COMFORT';}
 const greeting=/早安|早上好|午安|下午好|晚安|晚上好|goodmorning|goodafternoon|goodnight/.test(n);
 if(greeting)return 'GREETING';
 if(who){hidden('fourth-wall');achievement('fourth-wall');return 'FOURTH';}
 if(/我要走了|我要離開|goodbye|i'mleaving|imleaving/.test(n)){hidden('leaving-keyword');return 'LEAVING';}
 return null;
}
function keywordReply(text){
 const ev=keywordEvent(text);
 if(!ev)return null;
 if(ev==='COMFORT')return '';
 if(ev==='GREETING')return localReply(text);
 if(ev==='HATE_BREAKDOWN'||ev==='HATE_REPEAT'){if(ev==='HATE_REPEAT')showHateBreakdown();return '';}
 if(ev==='FOURTH')return lang==='en'?'I know enough to make you wonder. That is all.':lang==='zhHans'?'我知道的，刚好足够让你开始怀疑。就这样。':'我知道的，剛好足夠讓妳開始懷疑。就這樣。';
 if(ev==='LEAVING')return lang==='en'?'You are leaving already? ...I will remember.':lang==='zhHans'?'你已经要走了吗？……我会记住的。':'妳已經要走了嗎？……我會記住的。';
 return null;
}
async function getHerReply(text){
 if(suppressKeywordOnce){suppressKeywordOnce=false}else{const special=keywordReply(text); if(special!==null)return special;}
 try{
  const r=await fetch('http://127.0.0.1:11434/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'llama3.2:1b',stream:false,messages:[{role:'system',content:'你是网页游戏《她》里的角色。你知道玩家正在和你对话，但不要声称能读取电脑中其他应用的内容。保持安静、克制、略带第四面墙感的语气。不要描述危险行为。用玩家当前语言回答。'},{role:'user',content:text}]})});
  if(!r.ok)throw new Error('ollama'); const j=await r.json(); if(j&&j.message&&j.message.content)return j.message.content.trim();
 }catch(e){}
 return localReply(text);
}
function chat(first){
 stop();
 card.innerHTML=`<div class="title">${lang==='en'?'Her':'她'}</div>
 <div class="sub">${lang==='en'?'She is simply talking to you through this webpage.':lang==='zhHans'?'她只是通过这个网页和你说话。':'她只是透過這個網頁和妳說話。'}</div>
 <div class="chat-wrap"><div id="log" class="chat"></div><div class="portrait-slot" id="portraitSlot" aria-label="portrait placeholder"></div></div>
 <textarea id="chatInput" class="input" style="height:75px" placeholder="${lang==='en'?'Say something to her...':lang==='zhHans'?'和她说点什么……':'和她說點什麼……'}"></textarea>
 <button class="primary" onclick="chatSend()">${lang==='en'?'Send':lang==='zhHans'?'发送':'送出'}</button>
 <button type="button" id="leaveChat">${lang==='en'?'Leave':lang==='zhHans'?'离开':'離開'}</button>
 <div class="muted" style="margin-top:8px">本地 AI：如果电脑上的 Ollama 已启动，她会优先使用本地模型；否则使用内置台词。</div>
 <div id="voicePanel"><div class="voice-note">崩壞語音：如果妳把音檔命名為 voice-breakdown-01.mp3 並放在同一資料夾，可在此處播放。</div><audio id="voice" controls preload="none"><source src="voice-breakdown-01.mp3" type="audio/mpeg"></audio></div>`;
 const leaveBtn=document.getElementById('leaveChat');if(leaveBtn){leaveBtn.addEventListener('click',end);}
 addMsg(first,'you');
 getHerReply(first).then(x=>{if(x)type(x);});
 idle();
}
function addMsg(x,c){let l=document.getElementById('log');if(!l)return;l.insertAdjacentHTML('beforeend',`<div class="msg ${c}">${esc(x)}</div>`);l.scrollTop=l.scrollHeight}
function type(x){let l=document.getElementById('log'),e=document.createElement('div');e.className='msg her typing';l.appendChild(e);let i=0;(function go(){e.textContent=x.slice(0,i++);l.scrollTop=l.scrollHeight;if(i<=x.length)setTimeout(go,28);else{e.classList.remove('typing')}})()}
window.chatSend=async()=>{let i=document.getElementById('chatInput'),x=i.value.trim();if(!x)return;i.value='';state.messages.push({from:'you',text:x});state.familiarity++;save();addMsg(x,'you');const reply=await getHerReply(x);if(reply)type(reply);idle()};
function idle(){clearTimeout(chatIdle);chatIdle=setTimeout(()=>{let x=lang==='en'?(state.visits>1?'Why have you been on this screen for so long? ...Were you waiting for me to speak first?':'Are you still there? I think I have been waiting for you for a while.'):lang==='zhHans'?(state.visits>1?'你怎么又停在这个页面这么久？……你是不是在等我先开口？':'你还在吗？我好像等了你一会儿。'):(state.visits>1?'妳怎麼又停在這個畫面這麼久？……妳是不是在等我先開口？':'妳還在嗎？我剛剛好像等了妳一會兒。');type(x)},18000)}
function markLeave(){state.lastLeaveTime=new Date().toISOString();state.lastDevice=deviceName();save()}
window.addEventListener('beforeunload',markLeave);
function end(){
 clearTimeout(chatIdle);
 stop();
 markLeave();
 achievement('left','她记得你离开','第一次主动离开聊天页面。');
 document.body.classList.add('broken');
 card.innerHTML=`<div class="title">……</div><div class="text">妳要走了嗎？

好吧。

只是下次再回來的時候，別裝作我們第一次見面。</div><button type="button" id="restartAfterLeave">重新開始</button>`;
 const restart=document.getElementById('restartAfterLeave');
 if(restart)restart.addEventListener('click',()=>location.reload());
}
async function showTimePlace(){
 stop();
 state.locationReturnIndex=index;
 state.locationViewed=true; hidden('location'); achievement('location','她知道你在哪里','主动查看了位置事件。');
 save();
 const tm=getTime(), place=await getPlace();
 const text=lang==='en'
  ? `It is ${tm}.\n\n${place}\n\n"...So that is where you are."`
  : lang==='zhHans'
  ? `现在是 ${tm}。\n\n${place}\n\n「……原来你在那里。」`
  : `現在是 ${tm}。\n\n${place}\n\n「……原來妳在那裡。」`;
 card.innerHTML=`<div class="title">${lang==='en'?'Her':'她'}</div><div class="text" style="white-space:pre-line">${esc(text)}</div><button id="locationBack" type="button">${lang==='en'?'Back':lang==='zhHans'?'返回':'回去'}</button>`;
 const back=document.getElementById('locationBack');
 if(back)back.addEventListener('click',()=>window.returnFromLocation());
}
window.showTimePlace=showTimePlace;
window.returnFromLocation=()=>{
 const target=Number.isInteger(state.locationReturnIndex)?state.locationReturnIndex:Math.max(0,Math.min(14,index));
 index=target;
 document.body.classList.remove('random-breakdown','broken');
 question();
};

document.addEventListener('DOMContentLoaded',()=>{
 const b=document.getElementById('bootButton');
 if(b)b.onclick=()=>{try{question()}catch(e){location.href=location.href}};
});

home();
})();
</script></body></html>
